[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fragility-paper"
version = "2.0.0"
description = "Exact worst-case certification and repair of recurrent policies trained against optimal teachers (CPU-only)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Starlyn Eliezer Rosario Reyes", email = "starlyneliezerrosario@gmail.com" },
]
keywords = [
    "reinforcement-learning",
    "tic-tac-toe",
    "connect-four",
    "rock-paper-scissors",
    "worst-case-certification",
    "tie-breaking",
    "liquid-neural-networks",
    "cfc",
    "reproducibility",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # CPU-only study. For a small CPU wheel install torch first, e.g.:
    #   pip install torch --index-url https://download.pytorch.org/whl/cpu
    "torch>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
]

[project.urls]
Repository = "https://github.com/starlyn2010/fragility-paper"
Issues = "https://github.com/starlyn2010/fragility-paper/issues"

[tool.setuptools]
package-dir = { "" = "src" }
# Flat modules: every file below imports its siblings as top-level modules
# (e.g. ``from liquid_rl_trainer import ...``), so they are shipped as
# py-modules rather than a package. Listed modules import cleanly as-is.
py-modules = [
    "liquid_rl_trainer",
    "ablation_ttt",
    "human_like_agent",
    "tbr_eval",
    "twin_mentor",
    "equivariance",
    "proposito",
    "legibilidad",
    "latent_geometry",
    "run_multiseed",
    "fragility_curve",
    "benchmark_act",
    "analyze_tbr",
    "oracle",
    "exact_twin_eval",
    "coverage_probe",
    "history_probe",
    "space_probe",
    "worst_case_eval",
    "distill_oracle",
    "distill_history",
    "memoryless",
    "eval_memoryless",
    "twin_ensemble",
    "make_figures",
    "distilar_mentor",
    "minimax_mentor",
    "connect4_env",
    "tournament",
    "evaluate_cross",
    "repair",
    "repair_figure",
    "c4_game",
    "c4_repair",
    "c4_verify",
    "c4_figure",
    "c4_endgame",
    "c4_endgame_verify",
    "rps_game",
    "rps_repair",
    "rps_verify",
    "rps_figure",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
omit = ["src/run_multiseed.py"]

[tool.coverage.report]
skip_empty = true
show_missing = true
